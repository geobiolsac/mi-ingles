:root{--azul:#1d4fbf;--amarillo:#f7b500;--fondo:#eef3ff;--verde:#1f9d55;--rojo:#d64545;--naranja:#ff7a00;
  --morado:#8a3ffc;--texto:#1b2440;--gris:#6b7590;--radio:22px;--en:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body.cursiva{--en:"Palmer",cursive}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:18px}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;box-shadow:0 3px 10px #0003}
header h1{flex:1;margin:0;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#ffffff26;color:#fff;border-radius:14px;padding:8px 12px;font-size:1.1rem;min-width:46px}
.hbtn.hidden{visibility:hidden}
main{max-width:1150px;margin:0 auto;padding:16px 14px 100px}
h2{margin:6px 0 4px;font-size:1.5rem}
.sub{color:var(--gris);margin:0 0 14px}
.en{font-family:var(--en)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.wgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:#fff;border-radius:var(--radio);padding:16px;box-shadow:0 3px 10px #1d4fbf1a;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.card.big{min-height:150px}
.card .ico{font-size:2.6rem;line-height:1}
.card .tt{font-weight:700;font-size:1.2rem}
.card .ds,.ds{color:var(--gris);font-size:.95rem}

.pic.md{font-size:2.2rem;height:2.6rem}.pic.md img{width:2.4rem;height:2.4rem}.pic.none.md{width:2.5rem;height:2.5rem;font-size:1.2rem}

she para niñas y mujeres, it para cosas y animales, they para varios.","o":["I","you","he","she","it","we","they"],"s":[["This is Tom. [He] is nine.","Este es Tom. Él tiene nueve.","👦"],["This is Anna. [She] is my sister.","Esta es Anna. Ella es mi hermana.","👧"],["Look at the kite! [It] is blue.","¡Mira la cometa! Es azul.","🪁"],["Sam and I are friends. [We] play football.","Sam y yo somos amigos. Jugamos fútbol.","⚽"],["My cousins live in Cusco. [They] have a llama.","Mis primos viven en Cusco. Tienen una llama.","🦙"],["[I] like ice cream.","Me gusta el helado.","🍦"],["[You] can sing very well.","Tú cantas muy bien.","🎤"],["Where is my ball? [It] is in the garden.","¿Dónde está mi pelota? Está en el jardín.","⚽"],["Grandma is in the kitchen. [She] is cooking.","La abuela está en la cocina. Está cocinando.","👵"],["The dogs are hungry. [They] want food.","Los perros tienen hambre. Quieren comida.","🐶"]]},{"id":"this","t":"this · that · these · those","ico":"👇","ex":"this (este) y these (estos) para lo que está cerca; that (ese) y those (esos) para lo que está lejos.","o":["this","that","these","those"],"s":[["[This] is my pencil.","Este es mi lápiz.","✏️"],["[That] is your bag.","Esa es tu mochila.","🎒"],["[These] are my books.","Estos son mis libros.","📚"],["[Those] are big trees.","Esos son árboles grandes.","🌳"],["What's [this]? It's a ruler.","¿Qué es esto? Es una regla.","📏"],["What's [that]? It's a plane.","¿Qué es eso? Es un avión.","✈️"],["Are [these] your socks?","¿Estas son tus medias?","🧦"],["[Those] birds are very small.","Esos pájaros son muy pequeños.","🐦"],["I like [this] cake.","Me gusta esta torta.","🍰"],["Look at [that] monkey!","¡Mira ese mono!","🐒"]]},{"id":"there","t":"there is · there are","ico":"☝️","ex":"«hay». There is para una cosa; there are para varias. En pregunta: Is there…? Are there…?","o":["There is","There are","there is","there are","Is there","Are there"],"s":[["[There is] a cat on the bed.","Hay un gato en la cama.","🐱"],["[There are] three apples.","Hay tres manzanas.","🍎"],["[There is] a park near my house.","Hay un parque cerca de mi casa.","🏞️"],["[There are] twenty children in my class.","Hay veinte niños en mi clase.","🧒"],["[There is] a big tree in the garden.","Hay un árbol grande en el jardín.","🌳"],["[There are] two fish in the water.","Hay dos peces en el agua.","🐟"],["[Is there] a computer in your room?","¿Hay una computadora en tu cuarto?","💻"],["[Are there] any bananas?","¿Hay plátanos?","🍌"],["[There is] a spider on the wall!","¡Hay una araña en la pared!","🕷️"],["[There are] many stars in the sky.","Hay muchas estrellas en el cielo.","⭐"]]},{"id":"havegot","t":"have got · has got","ico":"🤲","ex":"«tener». I, you, we, they + have got. He, she, it + has got. Corto: I've got, she's got.","o":["have got","has got","haven't got","hasn't got","Have","Has","got"],"s":[["I [have got] a dog.","Tengo un perro.","🐶"],["She [has got] long hair.","Ella tiene el pelo largo.","👧"],["We [have got] a new car.","Tenemos un carro nuevo.","🚗"],["He [has got] a red bike.","Él tiene una bicicleta roja.","🚲"],["They [have got] two cats.","Ellos tienen dos gatos.","🐱"],["The monster [has got] three eyes.","El monstruo tiene tres ojos.","👾"],["I [haven't got] a sister.","No tengo hermana.","🚫"],["He [hasn't got] a pen.","Él no tiene lapicero.","🖊️"],["[Have] you [got] a pet?","¿Tienes una mascota?","🐾"],["[Has] she [got] a brother?","¿Ella tiene un hermano?","👦"]]},{"id":"can","t":"can · can't","ico":"💪","ex":"«poder» o «saber hacer». Es igual para todos: I can, he can, they can. Negativo: can't.","o":["can","can't","Can"],"s":[["I [can] swim.","Sé nadar.","🏊"],["She [can] ride a bike.","Ella sabe montar bicicleta.","🚴"],["Fish [can't] walk.","Los peces no pueden caminar.","🐟"],["Birds [can] fly.","Los pájaros pueden volar.","🐦"],["My baby brother [can't] talk.","Mi hermanito bebé no sabe hablar.","👶"],["We [can] play in the park.","Podemos jugar en el parque.","🏞️"],["[Can] you sing?","¿Sabes cantar?","🎤"],["[Can] I go to the toilet, please?","¿Puedo ir al baño, por favor?","🚽"],["Monkeys [can] climb trees.","Los monos pueden trepar árboles.","🐒"],["I [can't] find my shoe!","¡No encuentro mi zapato!","👞"]]},{"id":"like","t":"like · likes · don't like","ico":"👍","ex":"«gustar». I, you, we, they like. He, she, it likes (con s). No: don't like / doesn't like.","o":["like","likes","don't like","doesn't like","Do","Does"],"s":[["I [like] bananas.","Me gustan los plátanos.","🍌"],["She [likes] dancing.","A ella le gusta bailar.","💃"],["He [likes] football.","A él le gusta el fútbol.","⚽"],["We [like] our teacher.","Nos gusta nuestra profesora.","🧑‍🏫"],["I [don't like] spiders.","No me gustan las arañas.","🕷️"],["My dad [doesn't like] cats.","A mi papá no le gustan los gatos.","🐱"],["[Do] you like pizza? Yes, I do.","¿Te gusta la pizza? Sí.","🍕"],["[Does] she like music? Yes, she does.","¿A ella le gusta la música? Sí.","🎵"],["They [like] playing games.","A ellos les gusta jugar.","🎮"],["My grandma [likes] flowers.","A mi abuela le gustan las flores.","🌸"]]},{"id":"articulos","t":"a · an · plurales","ico":"1️⃣","ex":"a antes de consonante (a cat); an antes de vocal (an apple). Para varios se agrega -s (cats); algunos cambian: mouse → mice, child → children.","o":["a","an","cats","apples","mice","children","feet","teeth","men","women","sheep","boxes","watches"],"s":[["It's [a] cat.","Es un gato.","🐱"],["It's [an] apple.","Es una manzana.","🍎"],["It's [an] egg.","Es un huevo.","🥚"],["I've got [a] kite and [an] orange.","Tengo una cometa y una naranja.","🪁"],["I've got two [cats].","Tengo dos gatos.","🐱"],["There are three [mice].","Hay tres ratones.","🐭"],["The [children] are playing.","Los niños están jugando.","🧒"],["I've got two [feet].","Tengo dos pies.","🦶"],["Brush your [teeth]!","¡Lávate los dientes!","🦷"],["There are five [sheep] on the farm.","Hay cinco ovejas en la granja.","🐑"]]},{"id":"donde","t":"in · on · under · next to · behind · between","ico":"📍","ex":"Dónde está algo: in (dentro), on (sobre), under (debajo), next to (al lado), behind (detrás), between (entre), in front of (delante).","o":["in","on","under","next to","behind","between","in front of"],"s":[["The ball is [in] the box.","La pelota está dentro de la caja.","📦"],["The book is [on] the desk.","El libro está sobre la carpeta.","📕"],["The cat is [under] the chair.","El gato está debajo de la silla.","🪑"],["The lamp is [next to] the bed.","La lámpara está al lado de la cama.","💡"],["The dog is [behind] the door.","El perro está detrás de la puerta.","🚪"],["I'm sitting [between] Ana and Luis.","Estoy sentado entre Ana y Luis.","🧒"],["The car is [in front of] the house.","El carro está delante de la casa.","🚗"],["The fish are [in] the water.","Los peces están en el agua.","🐟"],["My shoes are [under] the bed.","Mis zapatos están debajo de la cama.","👞"],["The picture is [on] the wall.","El cuadro está en la pared.","🖼️"]]},{"id":"posesivos","t":"my · your · his · her · 's","ico":"🙋","ex":"De quién es algo: my (mi), your (tu), his (de él), her (de ella), our (nuestro), their (de ellos). Con nombres se usa 's: Tom's bike.","o":["my","your","his","her","our","their","Tom's","Anna's","dog's","Whose"],"s":[["This is [my] bag.","Esta es mi mochila.","🎒"],["Is this [your] pencil?","¿Este es tu lápiz?","✏️"],["[His] name is Leo.","Su nombre es Leo (de él).","👦"],["[Her] dress is pink.","Su vestido es rosado (de ella).","👗"],["[Our] school is big.","Nuestro colegio es grande.","🏫"],["[Their] house is blue.","Su casa es azul (de ellos).","🏠"],["This is [Tom's] bike.","Esta es la bicicleta de Tom.","🚲"],["[Anna's] cat is white.","El gato de Anna es blanco.","🐱"],["The [dog's] tail is long.","La cola del perro es larga.","🐶"],["[Whose] hat is this? It's mine.","¿De quién es este sombrero? Es mío.","👒"]]},{"id":"continuo","t":"is / are + -ing (ahora)","ico":"🏃","ex":"Lo que está pasando ahora mismo: am / is / are + verbo con -ing.","o":["am","is","are","ing","running","eating","reading","playing","sleeping","swimming","drawing","raining","watching","singing","flying","cooking"],"s":[["I [am reading] a book.","Estoy leyendo un libro.","📖"],["She [is eating] an apple.","Ella está comiendo una manzana.","🍎"],["They [are playing] football.","Ellos están jugando fútbol.","⚽"],["The baby [is sleeping].","El bebé está durmiendo.","👶"],["We [are swimming] in the sea.","Estamos nadando en el mar.","🌊"],["He [is drawing] a monster.","Él está dibujando un monstruo.","👾"],["It [is raining] today.","Hoy está lloviendo.","🌧️"],["Mum [is cooking] dinner.","Mamá está cocinando la cena.","🍳"],["What [are] you [doing]?","¿Qué estás haciendo?","❓"],["The birds [are flying].","Los pájaros están volando.","🐦"]]},{"id":"preguntas","t":"What · Where · Who · How many · How old","ico":"❓","ex":"Palabras para preguntar: What (qué), Where (dónde), Who (quién), How many (cuántos), How old (cuántos años), What colour (de qué color).","o":["What","Where","Who","How many","How old","What colour","When","Why","How"],"s":[["[What] is your name?","¿Cómo te llamas?","📛"],["[Where] is my book?","¿Dónde está mi libro?","📕"],["[Who] is that girl?","¿Quién es esa niña?","👧"],["[How many] dogs are there?","¿Cuántos perros hay?","🐶"],["[How old] are you?","¿Cuántos años tienes?","🎂"],["[What colour] is your bike?","¿De qué color es tu bicicleta?","🚲"],["[Where] do you live?","¿Dónde vives?","🏠"],["[What] are you eating?","¿Qué estás comiendo?","🍽️"],["[When] is your birthday?","¿Cuándo es tu cumpleaños?","📅"],["[Why] are you sad?","¿Por qué estás triste?","😢"]]},{"id":"ordenes","t":"Órdenes y Let's","ico":"📢","ex":"Para pedir algo se empieza con el verbo: Sit down! Para no: Don't run! Para invitar: Let's play!","o":["Sit down","Stand up","Open","Close","Look","Listen","Don't","Let's","Come","Be"],"s":[["[Sit down], please.","Siéntate, por favor.","🪑"],["[Open] your book.","Abre tu libro.","📖"],["[Look] at the board.","Mira la pizarra.","👀"],["[Listen] to the song.","Escucha la canción.","🎧"],["[Don't] run in the classroom!","¡No corras en el salón!","🚫"],["[Don't] touch the dog.","No toques al perro.","🐶"],["[Let's] play hide and seek!","¡Juguemos a las escondidas!","🙈"],["[Let's] go to the beach!","¡Vamos a la playa!","🏖️"],["[Come] here, please.","Ven aquí, por favor.","👋"],["[Be] careful!","¡Ten cuidado!","⚠️"]]},{"id":"rutina","t":"Presente: todos los días","ico":"📅","ex":"Lo que haces siempre: I play. Con he, she, it se agrega -s: she plays, he gets up, it eats.","o":["get up","gets up","go","goes","have","has","play","plays","eat","eats","watch","watches","brush","brushes"],"s":[["I [get up] at seven o'clock.","Me levanto a las siete.","⏰"],["She [gets up] at six o'clock.","Ella se levanta a las seis.","⏰"],["We [go] to school by bus.","Vamos al colegio en bus.","🚌"],["He [goes] to school by bike.","Él va al colegio en bicicleta.","🚲"],["I [have] breakfast with my family.","Tomo desayuno con mi familia.","🥣"],["My dad [has] coffee every morning.","Mi papá toma café todas las mañanas.","☕"],["They [play] football on Saturdays.","Ellos juegan fútbol los sábados.","⚽"],["My cat [eats] fish.","Mi gato come pescado.","🐱"],["I [brush] my teeth after dinner.","Me lavo los dientes después de la cena.","🪥"],["Grandpa [watches] TV in the evening.","El abuelo ve televisión en la noche.","📺"]]},{"id":"will","t":"will (futuro)","ico":"🔮","ex":"Para lo que va a pasar: will + verbo. Negativo: won't.","o":["will","won't","Will","'ll"],"s":[["It [will] rain tomorrow.","Mañana va a llover.","🌧️"],["I [will] help you.","Te voy a ayudar.","🤝"],["She [will] be ten next year.","Ella cumplirá diez el próximo año.","🎂"],["We [will] go to the zoo on Sunday.","Iremos al zoológico el domingo.","🦁"],["[Will] you come to my party?","¿Vendrás a mi fiesta?","🥳"],["I [won't] eat all the cake.","No me comeré toda la torta.","🍰"],["They [will] win the match.","Ellos ganarán el partido.","🏆"],["The robot [will] clean my room.","El robot limpiará mi cuarto.","🤖"],["I think it [will] be sunny.","Creo que va a estar soleado.","☀️"],["[I'll] call you later.","Te llamo más tarde.","📞"]]},{"id":"pasado","t":"was · were (pasado)","ico":"⏮️","ex":"«era/estaba». I, he, she, it + was. You, we, they + were.","o":["was","were","wasn't","weren't","Was","Were"],"s":[["I [was] at home yesterday.","Ayer estuve en casa.","🏠"],["She [was] very happy.","Ella estaba muy feliz.","😀"],["We [were] at the beach.","Estuvimos en la playa.","🏖️"],["They [were] tired after the match.","Estaban cansados después del partido.","😫"],["The film [was] funny.","La película fue graciosa.","😂"],["It [wasn't] cold.","No hacía frío.","🌤️"],["[Were] you at school today?","¿Estuviste hoy en el colegio?","🏫"],["The dinosaurs [were] very big.","Los dinosaurios eran muy grandes.","🦕"],["My grandpa [was] a farmer.","Mi abuelo era granjero.","🧑‍🌾"],["The shops [weren't] open.","Las tiendas no estaban abiertas.","🏪"]]},{"id":"pasado2","t":"Pasado: played · went · ate","ico":"📜","ex":"Lo que ya pasó. Muchos verbos agregan -ed (played). Otros cambian: go → went, eat → ate, see → saw, have → had.","o":["played","watched","visited","went","ate","saw","had","made","did","liked","jumped","ran"],"s":[["I [played] with my friends yesterday.","Ayer jugué con mis amigos.","🎮"],["We [went] to the cinema.","Fuimos al cine.","🎬"],["She [ate] a big sandwich.","Ella se comió un sándwich grande.","🥪"],["They [saw] a whale!","¡Vieron una ballena!","🐋"],["I [had] a great birthday.","Tuve un cumpleaños genial.","🎂"],["He [watched] a film last night.","Él vio una película anoche.","🎬"],["We [visited] our grandma.","Visitamos a nuestra abuela.","👵"],["Mum [made] a chocolate cake.","Mamá hizo una torta de chocolate.","🍫"],["The frog [jumped] into the water.","La rana saltó al agua.","🐸"],["I [ran] very fast.","Corrí muy rápido.","🏃"]]},{"id":"comparar","t":"bigger than · the biggest","ico":"📏","ex":"Para comparar: big → bigger than (más grande que) → the biggest (el más grande). Palabras largas: more beautiful.","o":["bigger","smaller","taller","faster","older","longer","than","the biggest","the tallest","the fastest","better","the best","more"],"s":[["An elephant is [bigger than] a dog.","Un elefante es más grande que un perro.","🐘"],["A mouse is [smaller than] a cat.","Un ratón es más pequeño que un gato.","🐭"],["My brother is [taller than] me.","Mi hermano es más alto que yo.","🧍"],["A plane is [faster than] a car.","Un avión es más rápido que un carro.","✈️"],["The giraffe is [the tallest] animal.","La jirafa es el animal más alto.","🦒"],["The whale is [the biggest] animal in the sea.","La ballena es el animal más grande del mar.","🐋"],["Grandpa is [older than] Dad.","El abuelo es mayor que papá.","👴"],["My drawing is [better than] yesterday.","Mi dibujo está mejor que ayer.","✏️"],["This is [the best] day ever!","¡Es el mejor día de todos!","🌟"],["A snake is [longer than] a worm.","Una serpiente es más larga que un gusano.","🐍"]]}],"stories":[{"id":"s1","t":"Hello, I'm Leo!","ico":"👦","lv":1,"p":[["Hello! My name is Leo.","¡Hola! Me llamo Leo."],["I am eight years old.","Tengo ocho años."],["I live in Lima with my family.","Vivo en Lima con mi familia."],["I have got a sister. Her name is Lucy.","Tengo una hermana. Se llama Lucy."],["She is six.","Ella tiene seis."],["We have also got a dog called Max.","También tenemos un perro que se llama Max."],["He is brown and white.","Es marrón con blanco."],["My favourite colour is green.","Mi color favorito es el verde."],["I like football and ice cream.","Me gusta el fútbol y el helado."]],"q":[["How old is Leo?","eight","six","ten"],["What is the dog's name?","Max","Lucy","Leo"],["What is Leo's favourite colour?","green","brown","blue"]]},{"id":"s2","t":"My classroom","ico":"🏫","lv":1,"p":[["This is my classroom.","Este es mi salón."],["It is big and clean.","Es grande y limpio."],["There are twenty desks and twenty chairs.","Hay veinte carpetas y veinte sillas."],["There is a big board on the wall.","Hay una pizarra grande en la pared."],["There is a computer next to the window.","Hay una computadora al lado de la ventana."],["My teacher is Miss Rosa.","Mi profesora es Miss Rosa."],["She is very kind.","Es muy amable."],["In my bag I have got a book, a pencil and a ruler.","En mi mochila tengo un libro, un lápiz y una regla."],["I like my school!","¡Me gusta mi colegio!"]],"q":[["How many desks are there?","twenty","twelve","ten"],["Where is the computer?","next to the window","under the board","in the bag"],["Who is Miss Rosa?","the teacher","Leo's sister","a friend"]]},{"id":"s3","t":"Play time!","ico":"🪁","lv":1,"p":[["It is Saturday.","Es sábado."],["Leo and his friend Sam are in the park.","Leo y su amigo Sam están en el parque."],["Sam has got a red kite.","Sam tiene una cometa roja."],["Leo has got a ball.","Leo tiene una pelota."],["\"Let's fly the kite!\" says Sam.","«¡Volemos la cometa!», dice Sam."],["The kite goes up, up, up!","¡La cometa sube, sube y sube!"],["Then they play football.","Luego juegan fútbol."],["Leo kicks the ball. Goal!","Leo patea la pelota. ¡Gol!"],["They are happy.","Están felices."]],"q":[["What day is it?","Saturday","Monday","Sunday"],["What colour is the kite?","red","blue","green"],["What does Leo kick?","the ball","the kite","the dog"]]},{"id":"s4","t":"At home","ico":"🏠","lv":1,"p":[["Our house has got five rooms.","Nuestra casa tiene cinco cuartos."],["There is a kitchen, a living room, a bathroom and two bedrooms.","Hay una cocina, una sala, un baño y dos dormitorios."],["Mum is in the kitchen.","Mamá está en la cocina."],["She is making soup.","Está haciendo sopa."],["Dad is in the living room.","Papá está en la sala."],["He is reading a book on the sofa.","Está leyendo un libro en el sofá."],["Lucy is in the bedroom.","Lucy está en el dormitorio."],["She is drawing a cat.","Está dibujando un gato."],["Where is Max? He is under the bed!","¿Dónde está Max? ¡Está debajo de la cama!"]],"q":[["How many rooms has the house got?","five","three","two"],["What is Mum making?","soup","a cake","a cat"],["Where is Max?","under the bed","on the sofa","in the kitchen"]]},{"id":"s5","t":"Meet my family","ico":"👨‍👩‍👧","lv":1,"p":[["This is my family.","Esta es mi familia."],["My mum is a doctor. She is tall.","Mi mamá es doctora. Es alta."],["My dad is a cook. He has got a beard.","Mi papá es cocinero. Tiene barba."],["My grandma is old, but she can dance!","Mi abuela es mayor, ¡pero sabe bailar!"],["My grandpa has got glasses.","Mi abuelo tiene lentes."],["He likes gardening.","Le gusta la jardinería."],["My cousin Lucas is a baby.","Mi primo Lucas es bebé."],["He can't walk, but he can laugh.","No sabe caminar, pero sabe reír."],["I love my family.","Quiero a mi familia."]],"q":[["What is Mum's job?","doctor","cook","teacher"],["Who has got a beard?","Dad","Grandma","Lucas"],["Who can dance?","Grandma","Lucas","Grandpa"]]},{"id":"s6","t":"Dinner time","ico":"🍽️","lv":1,"p":[["It is seven o'clock.","Son las siete."],["It is dinner time.","Es hora de cenar."],["Dad is cooking chicken and rice.","Papá está cocinando pollo con arroz."],["Lucy doesn't like carrots.","A Lucy no le gustan las zanahorias."],["I like carrots. They are orange and sweet.","A mí me gustan las zanahorias. Son anaranjadas y dulces."],["We drink water and orange juice.","Tomamos agua y jugo de naranja."],["For dessert there is ice cream.","De postre hay helado."],["\"Yummy!\" says Lucy.","«¡Qué rico!», dice Lucy."]],"q":[["What time is it?","seven o'clock","six o'clock","eight o'clock"],["Who doesn't like carrots?","Lucy","Leo","Dad"],["What is for dessert?","ice cream","cake","bananas"]]},{"id":"s7","t":"At the farm","ico":"🐄","lv":1,"p":[["Today we are at Uncle Pedro's farm.","Hoy estamos en la granja del tío Pedro."],["There are many animals.","Hay muchos animales."],["There are three cows and a horse.","Hay tres vacas y un caballo."],["The sheep are eating grass.","Las ovejas están comiendo pasto."],["The ducks are swimming in the pond.","Los patos están nadando en el estanque."],["A small brown goat is behind the tree.","Una cabrita marrón está detrás del árbol."],["Uncle Pedro gives me an egg.","El tío Pedro me da un huevo."],["\"Our hens give us eggs every day!\" he says.","«¡Nuestras gallinas nos dan huevos todos los días!», dice."]],"q":[["How many cows are there?","three","two","five"],["What are the ducks doing?","swimming","eating","sleeping"],["Where is the goat?","behind the tree","in the pond","on the horse"]]},{"id":"s8","t":"My town","ico":"🏘️","lv":1,"p":[["I live in a big town.","Vivo en una ciudad grande."],["Next to my house there is a park.","Al lado de mi casa hay un parque."],["Behind the park there is a hospital.","Detrás del parque hay un hospital."],["There is a supermarket in my street.","Hay un supermercado en mi calle."],["On Sundays we go to the market.","Los domingos vamos al mercado."],["We buy fruit and fish.","Compramos fruta y pescado."],["My favourite place is the library.","Mi lugar favorito es la biblioteca."],["There are lots of books there!","¡Hay muchos libros allí!"]],"q":[["What is next to the house?","a park","a hospital","a library"],["When do they go to the market?","on Sundays","on Mondays","every day"],["What is the favourite place?","the library","the market","the park"]]},{"id":"s9","t":"The lost sock","ico":"🧦","lv":2,"p":[["Lucy is looking for her blue sock.","Lucy está buscando su media azul."],["It isn't in her bag.","No está en su mochila."],["It isn't under the bed.","No está debajo de la cama."],["It isn't in the bathroom.","No está en el baño."],["\"Where is my sock?\" she asks.","«¿Dónde está mi media?», pregunta."],["Then she sees Max.","Entonces ve a Max."],["Max is in the garden.","Max está en el jardín."],["He is playing with a blue sock!","¡Está jugando con una media azul!"],["\"Max! That's my sock!\" Lucy laughs.","«¡Max! ¡Esa es mi media!», se ríe Lucy."]],"q":[["What colour is the sock?","blue","red","white"],["Who has got the sock?","Max","Leo","Mum"],["Where is Max?","in the garden","under the bed","in the bathroom"]]},{"id":"s10","t":"Our hobbies","ico":"⚽","lv":2,"p":[["My friends and I have got different hobbies.","Mis amigos y yo tenemos pasatiempos diferentes."],["Sam likes swimming. He swims on Tuesdays.","A Sam le gusta nadar. Nada los martes."],["Ana likes music. She can play the guitar.","A Ana le gusta la música. Sabe tocar la guitarra."],["Luis likes drawing. He draws animals and monsters.","A Luis le gusta dibujar. Dibuja animales y monstruos."],["I like football and reading.","A mí me gusta el fútbol y leer."],["On Fridays we play basketball together.","Los viernes jugamos básquet juntos."],["It's fun!","¡Es divertido!"]],"q":[["What can Ana play?","the guitar","the piano","football"],["When does Sam swim?","on Tuesdays","on Fridays","on Sundays"],["What does Luis draw?","animals and monsters","cars","flowers"]]},{"id":"s11","t":"My birthday party","ico":"🎂","lv":2,"p":[["Today is my birthday. I am nine!","Hoy es mi cumpleaños. ¡Cumplo nueve!"],["My friends are at my house.","Mis amigos están en mi casa."],["There are balloons and a big chocolate cake.","Hay globos y una torta grande de chocolate."],["There are nine candles on the cake.","Hay nueve velas en la torta."],["Everybody sings \"Happy birthday!\"","Todos cantan «¡Feliz cumpleaños!»."],["I blow out the candles.","Soplo las velas."],["Sam gives me a present.","Sam me da un regalo."],["It's a robot! I love it.","¡Es un robot! Me encanta."]],"q":[["How old is Leo today?","nine","eight","ten"],["What kind of cake is it?","chocolate","strawberry","lemon"],["What is Sam's present?","a robot","a ball","a book"]]},{"id":"s12","t":"On holiday","ico":"🏖️","lv":2,"p":[["In summer we go on holiday to the beach.","En verano nos vamos de vacaciones a la playa."],["The sun is hot and the sea is blue.","El sol está caliente y el mar es azul."],["Dad is sleeping under the umbrella.","Papá está durmiendo bajo la sombrilla."],["Mum and Lucy are making a sandcastle.","Mamá y Lucy están haciendo un castillo de arena."],["I am swimming in the sea.","Yo estoy nadando en el mar."],["I can see a crab on a rock!","¡Veo un cangrejo sobre una roca!"],["In the afternoon we eat ceviche.","En la tarde comemos cebiche."],["It's the best day!","¡Es el mejor día!"]],"q":[["Where do they go on holiday?","the beach","the mountains","the farm"],["What is Dad doing?","sleeping","swimming","eating"],["What does Leo see on a rock?","a crab","a fish","a shell"]]},{"id":"s13","t":"The clever monkey","ico":"🐒","lv":2,"p":[["In the jungle there is a small monkey.","En la selva hay un monito."],["His name is Momo.","Se llama Momo."],["Momo is hungry. He wants a banana.","Momo tiene hambre. Quiere un plátano."],["The bananas are at the top of a very tall tree.","Los plátanos están en la punta de un árbol muy alto."],["Momo can't climb so high.","Momo no puede trepar tan alto."],["Then he sees a giraffe.","Entonces ve una jirafa."],["\"Can you help me, please?\" asks Momo.","«¿Me ayudas, por favor?», pregunta Momo."],["The giraffe gets the bananas with her long neck.","La jirafa saca los plátanos con su cuello largo."],["They share the bananas. Now they are friends!","Comparten los plátanos. ¡Ahora son amigos!"]],"q":[["What does Momo want?","a banana","an apple","water"],["Who helps Momo?","a giraffe","an elephant","a lion"],["What do they do with the bananas?","share them","throw them","sell them"]]},{"id":"s14","t":"A rainy day","ico":"🌧️","lv":2,"p":[["Today it is raining.","Hoy está lloviendo."],["We can't go to the park.","No podemos ir al parque."],["Lucy is bored. \"What can we do?\" she asks.","Lucy está aburrida. «¿Qué podemos hacer?», pregunta."],["\"Let's build a castle!\" I say.","«¡Construyamos un castillo!», digo yo."],["We use boxes, chairs and a blanket.","Usamos cajas, sillas y una frazada."],["Our castle is very big.","Nuestro castillo es muy grande."],["Max is the dragon!","¡Max es el dragón!"],["Mum brings hot chocolate.","Mamá trae chocolate caliente."],["Rainy days are fun too.","Los días de lluvia también son divertidos."]],"q":[["What is the weather like?","rainy","sunny","windy"],["What do they build?","a castle","a boat","a robot"],["Who is the dragon?","Max","Lucy","Mum"]]},{"id":"s15","t":"My school day","ico":"📅","lv":2,"p":[["I get up at half past six.","Me levanto a las seis y media."],["I wash my face and brush my teeth.","Me lavo la cara y los dientes."],["I have bread, eggs and milk for breakfast.","Desayuno pan, huevos y leche."],["I go to school by bus.","Voy al colegio en bus."],["My first class is English. I love it!","Mi primera clase es inglés. ¡Me encanta!"],["At break I play tag with my friends.","En el recreo juego chapadas con mis amigos."],["After school I do my homework.","Después del colegio hago mi tarea."],["At nine o'clock I go to bed.","A las nueve me voy a dormir."]],"q":[["What time does Leo get up?","half past six","seven o'clock","nine o'clock"],["How does Leo go to school?","by bus","by bike","by car"],["What is the first class?","English","Maths","Music"]]},{"id":"s16","t":"The space trip","ico":"🚀","lv":3,"p":[["One night I had a dream.","Una noche tuve un sueño."],["I was an astronaut!","¡Era astronauta!"],["My rocket was big and silver.","Mi cohete era grande y plateado."],["I flew to the moon with Max.","Volé a la luna con Max."],["The moon was grey and very quiet.","La luna era gris y muy silenciosa."],["We jumped very high. It was easy!","Saltamos muy alto. ¡Era fácil!"],["Then we saw a little green alien.","Luego vimos un extraterrestre verde y pequeño."],["He was friendly. He gave us a star.","Era amigable. Nos dio una estrella."],["Then I woke up. What a dream!","Entonces me desperté. ¡Qué sueño!"]],"q":[["Where did Leo fly?","to the moon","to the sea","to Cusco"],["What colour was the alien?","green","grey","silver"],["What did the alien give them?","a star","a rocket","a ball"]]},{"id":"s17","t":"The trip to Cusco","ico":"🦙","lv":3,"p":[["Last July we went to Cusco.","El julio pasado fuimos a Cusco."],["We went by plane. It was fast!","Fuimos en avión. ¡Fue rápido!"],["Cusco is in the mountains. It was very cold.","Cusco está en las montañas. Hacía mucho frío."],["I wore my jacket, my scarf and my hat.","Me puse mi casaca, mi bufanda y mi gorro."],["We visited Machu Picchu.","Visitamos Machu Picchu."],["It was beautiful and very old.","Era hermoso y muy antiguo."],["I saw a llama. It was white and brown.","Vi una llama. Era blanca con marrón."],["Lucy gave the llama some grass.","Lucy le dio un poco de pasto a la llama."],["I want to go back next year!","¡Quiero volver el próximo año!"]],"q":[["How did they go to Cusco?","by plane","by bus","by boat"],["What was the weather like?","cold","hot","rainy"],["What animal did Leo see?","a llama","a horse","a monkey"]]},{"id":"s18","t":"The brave little turtle","ico":"🐢","lv":3,"p":[["Tina was a little turtle.","Tina era una tortuguita."],["She lived on a beach with her brothers and sisters.","Vivía en una playa con sus hermanos y hermanas."],["One night they walked to the sea.","Una noche caminaron hacia el mar."],["The sea was big and dark.","El mar era grande y oscuro."],["Tina was scared. \"I can't swim!\" she said.","Tina tenía miedo. «¡No sé nadar!», dijo."],["Her big brother said, \"Yes, you can! Try!\"","Su hermano mayor dijo: «¡Sí puedes! ¡Inténtalo!»."],["Tina went into the water.","Tina entró al agua."],["She moved her legs, and… she swam!","Movió sus patas y… ¡nadó!"],["\"I can swim!\" she shouted. She was very proud.","«¡Sé nadar!», gritó. Estaba muy orgullosa."]],"q":[["Where did Tina live?","on a beach","in a forest","in a house"],["How did Tina feel at first?","scared","happy","hungry"],["What did Tina learn?","to swim","to fly","to run"]]},{"id":"s19","t":"Next weekend","ico":"🔮","lv":3,"p":[["Next weekend will be very special.","El próximo fin de semana será muy especial."],["My cousins will come to Lima.","Mis primos vendrán a Lima."],["On Saturday we will go to the zoo.","El sábado iremos al zoológico."],["We will see lions, monkeys and a big hippo.","Veremos leones, monos y un hipopótamo grande."],["On Sunday Grandma will make a big lunch.","El domingo la abuela hará un gran almuerzo."],["I think it will be sunny.","Creo que estará soleado."],["I won't watch TV.","No veré televisión."],["I will play with my cousins all day!","¡Jugaré con mis primos todo el día!"]],"q":[["Who will come to Lima?","the cousins","the teacher","the doctor"],["Where will they go on Saturday?","to the zoo","to the beach","to school"],["Who will make lunch on Sunday?","Grandma","Dad","Leo"]]},{"id":"s20","t":"The biggest and the smallest","ico":"🐘","lv":3,"p":[["Animals are all different.","Todos los animales son diferentes."],["The blue whale is the biggest animal in the world.","La ballena azul es el animal más grande del mundo."],["It is bigger than a bus!","¡Es más grande que un bus!"],["The giraffe is the tallest animal.","La jirafa es el animal más alto."],["The cheetah is the fastest. It is faster than a car.","El guepardo es el más rápido. Es más rápido que un carro."],["A tortoise is very slow, but it can live for a hundred years.","Una tortuga es muy lenta, pero puede vivir cien años."],["The smallest bird is the hummingbird.","El ave más pequeña es el colibrí."],["Which animal is your favourite?","¿Cuál animal es tu favorito?"]],"q":[["What is the biggest animal?","the blue whale","the giraffe","the elephant"],["Which animal is the fastest?","the cheetah","the tortoise","the whale"],["What is the smallest bird?","the hummingbird","the eagle","the penguin"]]}],"om":{"🟰":"data:image/svg+xml;base64,PHN2ZyBpZD0iZW1vamkiIHZpZXdCb3g9IjAgMCA3MiA3MiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZyBpZD0iY29sb3IiPgogICAgPGcgaWQ9ImxpbmUtMiI+CiAgICAgIDxwb2x5Z29uIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBzdHJva2Utd2lkdGg9IjIiI <script>
"use strict";
/* ================= datos ================= */
const W=DB.words.map((a,i)=>({i,en:a[0],ipa:a[1],fig:a[2],es:a[3],de:a[4],img:a[5],d:a[6],us:a[7],c:a[8]}));
const CATS=DB.cats; const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
CATS.forEach(c=>c.items=W.filter(w=>w.c===c.id));
const UNITS=DB.units, PHONICS=DB.phonics, GRAM=DB.gram, STORIES=DB.stories;
UNITS.forEach(u=>u.items.forEach(it=>it.mark=it.mark||it.en));
const BYEN={};W.forEach(w=>{const k=w.en.toLowerCase();(BYEN[k]=BYEN[k]||[]).push(w);});
UNITS.concat(PHONICS).forEach(g=>g.items.forEach(it=>{const k=it.en.toLowerCase();if(!BYEN[k])BYEN[k]=[it];}));
const L1WORDS=[...new Set(UNITS.flatMap(u=>u.items.map(i=>i.en)))];

/* ================= almacenamiento ================= */
const KEY='miIngles.v2';
let P={heard:{},said:{},stars:{},read:{}};
let CFG={accent:'GB',ipa:true,mic:true,font:'print',rate:0.85,tr:true};
try{const old=JSON.parse(localStorage.getItem('miIngles.v1')||'null');if(old&&old.P){P.heard=old.P.heard||{};P.said=old.P.said||{};P.stars=old.P.stars||{};}
  const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){P=Object.assign(P,s.P||{});CFG=Object.assign(CFG,s.CFG||{});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({P,CFG}))}catch(e){}}
function applyFont(){document.body.classList.toggle('cursiva',CFG.font==='cursive');}

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms||2600);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const COLORS=['#1d4fbf','#d64545','#1f9d55','#ff7a00','#8a3ffc','#0f9bb5','#c2185b'];
function colorFor(w){let h=0;for(const c of w)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length];}
const deacc=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
/* ¿la tablet dibuja este emoji? si no, usar OpenMoji */
const EMOK={};
function emojiOK(ch){if(ch in EMOK)return EMOK[ch];let ok=true;
  try{const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d',{willReadFrequently:true});
    x.textBaseline='top';x.font='20px sans-serif';x.fillText(ch,0,0);const d=x.getImageData(0,0,24,24).data;ok=false;
    for(let i=0;i<d.length;i+=4){if(d[i+3]>0&&(Math.abs(d[i]-d[i+1])>25||Math.abs(d[i+1]-d[i+2])>25)){ok=true;break;}}}catch(e){ok=true;}
  return EMOK[ch]=ok;}
function pic(it,cls){cls=cls||'';const im=it.img||'';
  if(im.startsWith('om:')||(DB.om[im]&&!emojiOK(im)))return DB.om[im]?`<div class="pic ${cls}"><img src="${DB.om[im]}" alt=""></div>`:'';
  if(/^[0-9A-Za-z½º•▬]{1,4}$/.test(im))return `<div class="pic num ${cls}">${esc(im)}</div>`;
  if(im)return `<div class="pic ${cls}">${im}</div>`;
  return `<div class="pic none ${cls}" style="background:${colorFor(it.en)}">${esc(it.en[0].toUpperCase())}</div>`;}
function marked(it){return esc(it.mark||it.en).replace(/\[([^\]]+)\]/g,'<span class="mk">$1</span>');}
function starsHtml(n){let s='';for(let i=1;i<=3;i++)s+=i<=n?'★':'<span class="off">★</span>';return `<span class="stars">${s}</span>`;}
const heardCount=items=>items.filter(i=>P.heard[i.en]).length;
const difStars=d=>'●'.repeat(d)+'○'.repeat(3-d);

/* ================= voz ================= */
let VOICES=[];
function loadVoices(){if('speechSynthesis' in window)VOICES=speechSynthesis.getVoices()||[];}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
const vlang=v=>(v.lang||'').replace('_','-').toLowerCase();
function pickVoice(){const want=CFG.accent==='US'?'en-us':'en-gb';
  if(CFG.voice){const cv=VOICES.find(v=>v.name===CFG.voice);if(cv)return cv;}
  const nat=v=>/natural|online|neural|google|premium|enhanced|siri/i.test(v.name);
  return VOICES.find(v=>vlang(v)===want&&nat(v))||VOICES.find(v=>vlang(v).startsWith('en')&&nat(v))||VOICES.find(v=>vlang(v)===want&&/google/i.test(v.name))||VOICES.find(v=>vlang(v)===want)||VOICES.find(v=>vlang(v).startsWith('en'))||null;}
const clean=t=>String(t).replace(/[\[\]]/g,'').replace(/…/g,'');
function utter(text,rate){const u=new SpeechSynthesisUtterance(clean(text));const v=pickVoice();if(v)u.voice=v;
  u.lang=CFG.accent==='US'?'en-US':'en-GB';u.rate=rate||CFG.rate;return u;}
function speak(text,rate,onend){if(!('speechSynthesis' in window)){toast('Esta tablet no tiene voz de lectura.');return;}
  stopKaraoke();speechSynthesis.cancel();const u=utter(text,rate);if(onend)u.onend=onend;speechSynthesis.speak(u);}

/* karaoke: resalta palabra por palabra */
let KAR=null;
function stopKaraoke(){if(KAR){KAR.stop=true;clearTimeout(KAR.t);document.querySelectorAll('.wd.on').forEach(e=>e.classList.remove('on'));KAR=null;}}
function wrapWords(text,keyed){ // devuelve html con spans .wd; [x] => clave
  let html='',pos=0;const plain=clean(text);
  const parts=String(text).split(/(\[[^\]]+\])/);
  for(const p of parts){if(!p)continue;const isKey=p.startsWith('[');const t=isKey?p.slice(1,-1):p;
    let inner='';t.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){inner+=tok;pos+=tok.length;return;}
      inner+=`<span class="wd" data-a="tapw" data-w="${esc(tok)}" data-p="${pos}">${esc(tok)}</span>`;pos+=tok.length;});
    html+=isKey&&keyed?`<span class="key">${inner}</span>`:inner;}
  return html;}
function karaoke(el,text,rate,done){
  if(!('speechSynthesis' in window)){toast('Esta tablet no tiene voz de lectura.');return;}
  stopKaraoke();speechSynthesis.cancel();
  const spans=[...el.querySelectorAll('.wd')];const K=KAR={stop:false,t:null,gotB:false};
  const r=rate||CFG.rate;const u=utter(text,r);
  const on=i=>{spans.forEach((s,j)=>s.classList.toggle('on',j===i));};
  const byPos=ci=>{let k=0;for(let j=0;j<spans.length;j++)if(+spans[j].dataset.p<=ci)k=j;return k;};
  u.onboundary=e=>{if(K.stop)return;if(e.name&&e.name!=='word')return;K.gotB=true;clearTimeout(K.t);on(byPos(e.charIndex));};
  u.onstart=()=>{let i=0;const step=()=>{if(K.stop||K.gotB)return;on(i);const w=spans[i]?spans[i].textContent:'';
      i++;if(i<=spans.length)K.t=setTimeout(step,(140+w.length*62)/r);};step();};
  u.onend=()=>{if(K.stop)return;clearTimeout(K.t);on(-1);if(KAR===K)KAR=null;if(done)done();};
  speechSynthesis.speak(u);}

/* ================= micrófono ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micOn=()=>!!SR&&CFG.mic;
const NUMS={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100};
const norm=s=>deacc(s).replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function judgeWord(target,alts){const t=norm(clean(target));let best=0,heard=alts[0]||'';
  for(const a of alts){const n=norm(a);let s;const num=NUMS[clean(target).toLowerCase()];
    if(n===t||(num!==undefined&&n===String(num)))s=1;else if(n.includes(t))s=.95;else s=1-lev(n,t)/Math.max(n.length,t.length);
    if(s>best){best=s;heard=a;}}
  return {ok:true,score:best,heard,level:best>=.85?'good':best>=.6?'mid':'bad'};}
function judgeSentence(target,alts){const tw=deacc(clean(target)).split(/\s+/).map(w=>w.replace(/[^a-z0-9']/g,'')).filter(Boolean);
  let best=0,heard=alts[0]||'';
  for(const a of alts){const aw=deacc(a).split(/\s+/).map(w=>w.replace(/[^a-z0-9']/g,''));let hit=0;
    tw.forEach(w=>{if(aw.some(x=>x===w||(w.length>3&&lev(x,w)<=1)))hit++;});const s=hit/tw.length;if(s>best){best=s;heard=a;}}
  return {ok:true,score:best,heard,level:best>=.8?'good':best>=.55?'mid':'bad'};}
const MIC_ERR={'not-allowed':'El micrófono no tiene permiso. Si el archivo se abrió directo en la tablet, Chrome puede bloquearlo.',
 'service-not-allowed':'Chrome no permite el micrófono aquí (necesita abrirse desde una dirección https).',
 'network':'El micrófono necesita internet para funcionar.','no-speech':'No te escuché. Acércate y habla un poco más fuerte.',
 'audio-capture':'No encuentro el micrófono de la tablet.','aborted':'Se canceló la escucha.','nosr':'Este navegador no tiene reconocimiento de voz.'};
let REC=null;
function listen(target,sentence,cb){if(!SR){cb({ok:false,err:'nosr'});return;}
  if(REC){try{REC.abort()}catch(e){}}const r=new SR();REC=r;let done=false;
  r.lang=CFG.accent==='US'?'en-US':'en-GB';r.interimResults=false;r.maxAlternatives=5;
  r.onresult=e=>{if(done)return;done=true;const alts=[...e.results[0]].map(a=>a.transcript);cb(sentence?judgeSentence(target,alts):judgeWord(target,alts));};
  r.onerror=e=>{if(done)return;done=true;cb({ok:false,err:e.error});};
  r.onend=()=>{if(done)return;done=true;cb({ok:false,err:'no-speech'});};
  try{stopKaraoke();if('speechSynthesis' in window)speechSynthesis.cancel();r.start();}catch(e){done=true;cb({ok:false,err:'aborted'});}}
function micFeedback(res,key){if(!res.ok)return {cls:'bad',txt:MIC_ERR[res.err]||('Error de micrófono: '+res.err)};
  if(res.level==='good'){if(key){P.said[key]=1;save();}return {cls:'good',txt:'¡Muy bien! 🎉 Escuché: «'+res.heard+'»'};}
  if(res.level==='mid')return {cls:'mid',txt:'¡Casi! Escuché: «'+res.heard+'». Inténtalo otra vez.'};
  return {cls:'bad',txt:'Escuché: «'+res.heard+'». Escucha 🔊 y repite.'};}
function micButton(btn,fbEl,target,sentence,key,label,after){
  btn.classList.add('listening');btn.textContent='👂 Escuchando…';fbEl.className='fb';fbEl.textContent='';
  listen(target,sentence,res=>{btn.classList.remove('listening');btn.textContent=label;const f=micFeedback(res,key);
    fbEl.className='fb '+f.cls;fbEl.textContent=f.txt;if(after)after(res);});}

   <button class="${c.dir==='en'?'on':''}" data-a="ddir" data-v="en">🇬🇧 Inglés → Español</button></div><button class="btn alt small" data-a="rand">🎲 Palabra al azar</button></div>
   <div id="dres">${dictResults(c)}</div>`;}
function dictSearch(q){q=deacc(q.trim());if(!q)return [];const sc=[];
  W.forEach(w=>{const en=w.en.toLowerCase(),es=deacc(w.es);const esParts=es.split(/[,()]/).map(x=>x.trim()).filter(Boolean);let s=0;
    if(en===q||esParts.includes(q))s=100;else if(en.startsWith(q)||esParts.some(p=>p.startsWith(q)))s=60;
    else if(en.split(/\s+/).some(t=>t.startsWith(q))||esParts.some(p=>p.split(/\s+/).some(t=>t.startsWith(q))))s=40;
    else if(q.length>=3&&(en.includes(q)||es.includes(q)))s=20;
    if(s)sc.push([s-w.d-(w.en.length/100),w]);});
  sc.sort((a,b)=>b[0]-a[0]);return sc.map(x=>x[1]);}
function dictResults(c){const q=(c.q||'').trim();
  if(!q){const by={};W.forEach(w=>{const k=deacc(c.dir==='es'?w.es:w.en)[0];by[k]=(by[k]||0)+1;});
    return `<p class="ds">Toca una letra para ver palabras:</p><div class="row">${Object.keys(by).filter(k=>/[a-zñ]/.test(k)).sort().map(k=>`<button class="btn alt small" data-a="letter" data-v="${k}">${k.toUpperCase()}</button>`).join('')}</div>`;}
  let res;if(q.startsWith('^')){const L=q.slice(1);res=W.filter(w=>deacc(c.dir==='es'?w.es:w.en).startsWith(L)).sort((a,b)=>deacc(c.dir==='es'?a.es:a.en).localeCompare(deacc(c.dir==='es'?b.es:b.en)));}
  else res=dictSearch(q);
  if(!res.length)return `<p class="sub">No encontré «${esc(q)}». Prueba con otra palabra.</p>`;
  c.res=res;
  return res.slice(0,c.lim).map((w,i)=>`<button class="dres" data-a="dcard" data-i="${i}">${pic(w,'md')}<div style="flex:1">
   ${c.dir==='es'?`<div class="h">${esc(w.es)}</div><div><b class="en" style="color:var(--azul);font-size:1.15rem">${esc(w.en)}</b> · <span style="color:var(--naranja);font-weight:700">${esc(w.fig)}</span></div><div class="s">${esc(w.de)}</div>`
   :`<div class="h en">${esc(w.en)} <span style="color:var(--naranja);font-size:1rem">${esc(w.fig)}</span></div><div>🇵🇪 <b>${esc(w.es)}</b></div><div class="s">${esc(w.de)}</div>`}
   </div><span class="ds">${difStars(w.d)}</span></button>`).join('')+(res.length>c.lim?`<button class="btn alt more" data-a="dmore">Ver más (${res.length-c.lim})</button>`:'');}

/* ---- tocar una palabra dentro de oraciones/cuentos ---- */
function lookupWord(raw){let w=raw.toLowerCase().replace(/[^a-z']/g,'').replace(/^'+|'+$/g,'');if(!w)return null;
  const tries=[w,w.replace(/'s$/,''),w.replace(/s$/,''),w.replace(/es$/,''),w.replace(/ies$/,'y'),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/([a-z])\1ing$/,'$1'),w.replace(/ed$/,''),w.replace(/ed$/,'e'),w.replace(/([a-z])\1ed$/,'$1'),w.replace(/er$/,''),w.replace(/est$/,''),w.replace(/([a-z])\1er$/,'$1'),w.replace(/([a-z])\1est$/,'$1')];
  for(const t of tries)if(t&&BYEN[t])return BYEN[t];return null;}

  if(!t.words){t.words=clean(s[0]).split(/\s+/);t.mix=shuffle(t.words.map((w,i)=>({w,i})));if(t.mix.every((m,j)=>m.i===j)&&t.mix.length>1)t.mix.reverse();}

function defP(){return {heard:{},said:{},stars:{},read:{},srs:{},hard:{},flag:{},streak:{last:'',n:0,days:{}},time:{},mis:0};}
P=Object.assign(defP(),P);
const today=()=>new Date().toLocaleDateString('en-CA');
const dayOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA');};
const WBY=en=>(BYEN[String(en).toLowerCase()]||[])[0];
const single=w=>/^[A-Za-z]+$/.test(w.en);

/* --- tiempo de uso --- */
setInterval(()=>{if(document.visibilityState==='visible'){const t=today();P.time[t]=(P.time[t]||0)+15;save();}},15000);

/* --- repaso inteligente (cajas de Leitner) --- */
const IV=[0,0,1,3,7,15];
function grade(en,ok){if(!en)return;const s=P.srs[en]||{b:0,due:0};
  if(ok){s.b=Math.min(5,s.b+1);s.due=Date.now()+IV[s.b]*864e5;}
  else{s.b=1;s.due=Date.now()+10*6e4;P.hard[en]=(P.hard[en]||0)+1;}
  P.srs[en]=s;save();}
const mastered=en=>(P.srs[en]||{}).b>=4;
function hardList(){return Object.keys(P.hard).filter(en=>P.hard[en]>0&&!mastered(en)).sort((a,b)=>P.hard[b]-P.hard[a]).map(WBY).filter(Boolean);}
function missionWords(n,write){const now=Date.now(),seen=new Set(),out=[];
  const add=w=>{if(!w||seen.has(w.en)||out.length>=n)return;if(write&&(!single(w)||w.en.length>9))return;seen.add(w.en);out.push(w);};
  Object.keys(P.srs).filter(en=>P.srs[en].due<=now&&P.srs[en].b<5).sort((a,b)=>P.srs[a].due-P.srs[b].due).forEach(en=>add(WBY(en)));
  hardList().forEach(add);
  shuffle(UNITS.flatMap(u=>u.items).filter(w=>!P.srs[w.en])).forEach(add);
  shuffle(W.filter(w=>w.d===1&&w.img&&!P.srs[w.en])).forEach(add);
  shuffle(W.filter(w=>w.d===2&&w.img)).forEach(add);
  return out;}

/* --- retos: inicio y rondas --- */
function article(w){return /^[aeiou]/i.test(w)?'an':'a';}
function startReto(k,mode,opt){opt=opt||{};let order,R0={k,mode};
  if(mode==='gram'){const g=opt.g||GRAM.find(x=>'g-'+x.id===k);order=shuffle(g.s).slice(0,opt.n||8).map((s,i)=>({s,type:i%2?'orden':'llena'}));R0.g=g;}
  else if(mode==='story'){const s=STORIES.find(x=>'s-'+x.id===k);order=s.q.map(q=>({q,opts:shuffle(q.slice(1))}));R0.st=s;}
  else if(mode==='yn'){const pool=W.filter(w=>w.c&&CAT[w.c].t==='n'&&single(w)&&w.img&&!/s$/.test(w.en)&&w.d<=2&&!/^[0-9]/.test(w.img));
    order=shuffle(pool).slice(0,8).map(w=>{let sh=w;if(Math.random()<.5){const o=shuffle(pool.filter(x=>x.c===w.c&&x.img!==w.img));sh=o[0]||shuffle(pool)[0];}return {w,sh,yes:sh.en===w.en};});}
  else if(mode==='letras'){const pool=W.filter(w=>single(w)&&w.img&&w.en.length>=3&&w.en.length<=7&&w.d<=2&&!/^[0-9]/.test(w.img));
    order=shuffle(pool).slice(0,6).map(w=>{const L=w.en.toLowerCase().split('');let m=shuffle(L.map((c,i)=>({c,i})));if(m.map(x=>x.c).join('')===L.join(''))m.reverse();return {w,mix:m};});}
  else if(mode==='gap'){const st=opt.st||shuffle(STORIES.filter(s=>s.lv<=2))[0];const toks=st.p.map(p=>p[0]).join(' ').split(/(\s+)/);const used=new Set(),bl=[];
    toks.forEach((t,i)=>{const w=t.replace(/[^A-Za-z]/g,'');const e=WBY(w.toLowerCase());if(bl.length<6&&w.length>2&&e&&e.c&&CAT[e.c].t==='n'&&!used.has(w.toLowerCase())&&i>4){used.add(w.toLowerCase());bl.push({i,w});}});
    order=bl;R0.toks=toks;R0.st=st;R0.bank=shuffle(bl.map(b=>b.w));R0.filled={};}
  else if(mode==='listen'){const all=GRAM.flatMap(g=>g.s.map(s=>({s,g})));order=shuffle(all).slice(0,6).map(x=>({s:x.s,opts:shuffle([x.s,...shuffle(x.g.s.filter(y=>y!==x.s)).slice(0,2)])}));}
  else{const items=opt.items||getSet(k).items;let pool=items;
    if(mode==='escribe'){pool=items.filter(w=>single(w)&&w.en.length<=10);if(!pool.length)pool=items;}
    const n=opt.n||(mode==='decir'||mode==='escribe'?6:8);order=opt.items&&opt.mission?shuffle(pool.slice(0,n)):shuffle(pool).slice(0,Math.min(n,pool.length));
    R0.S={items:opt.items?(items.length>=6?items:W):items};}
  R=Object.assign(R0,{order,i:0,res:[],lock:false,opts:null,built:[],mission:opt.mission||null});
  if(!order.length){toast('No hay suficientes palabras para este reto.');return;}
  const T={oir:'Reto: escucha y elige',decir:'Reto: dilo tú',gram:'Reto: completa y ordena',story:'Preguntas del cuento',escribe:'Reto: escucha y escribe',yn:'Starters · ¿Sí o no?',letras:'Starters · Ordena las letras',gap:'Starters · Completa el cuento',listen:'Starters · Escucha y elige'};
  if(cur().s==='reto')stack.pop();go('reto',{title:opt.mission?'🚀 Misión del día':T[mode]});setTimeout(onRoundStart,450);}
function onRoundStart(){if(!R||R.i>=R.order.length)return;const t=R.order[R.i];
  if(R.mode==='oir'||R.mode==='escribe')speak(t.en);else if(R.mode==='story')speak(t.q[0]);else if(R.mode==='listen')speak(clean(t.s[0]));

function retoV(){if(!R)return '';

let MR=null;
async function recordMe(btn,word){
  if(MR){try{MR.stop()}catch(e){}return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Esta tablet no permite grabar aquí (ábrelo desde la app instalada).');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Sin permiso de micrófono.');return;}
  const ch=[];const mr=new MediaRecorder(stream);MR=mr;stopKaraoke();if('speechSynthesis' in window)speechSynthesis.cancel();
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
  mr.onstop=()=>{MR=null;stream.getTracks().forEach(t=>t.stop());btn.classList.remove('listening');btn.textContent='⏺️ Grábate';
    const url=URL.createObjectURL(new Blob(ch,{type:mr.mimeType||'audio/webm'}));const a=new Audio(url);
    const fb=$('#fb');if(fb){fb.className='fb mid';fb.textContent='▶️ Así sonaste tú… y ahora la voz de la tablet:';}
    a.onended=()=>{speak(word);URL.revokeObjectURL(url);};a.play().catch(()=>speak(word));};
  mr.start();btn.classList.add('listening');btn.textContent='⏹️ Parar';setTimeout(()=>{if(MR===mr)mr.stop();},4000);}

    document.querySelectorAll('.opt').forEach((b,j)=>{if(t.opts[j]===t.q[1])b.classList.add('good');});if(!ok)el.classList.add('bad');
    speak(ok?'Well done!':t.q[1]);setTimeout(nextRound,ok?1100:2000);break;}
  case 'gpick':{if(R.lock)return;R.lock=true;const t=R.order[R.i],key=(t.s[0].match(/\[([^\]]+)\]/)||[])[1],ok=R.opts[+d.j]===key;R.res[R.i]=ok;
    document.querySelectorAll('.opt').forEach((b,j)=>{if(R.opts[j]===key)b.classList.add('good');});if(!ok)el.classList.add('bad');
    const bl=document.querySelector('.blank');if(bl)bl.textContent=key;speak(t.s[0]);setTimeout(nextRound,ok?2200:3000);break;}
  case 'chip':{if(R.lock)return;const t=R.order[R.i];R.built.push(+d.j);
    if(R.built.length===t.words.length){R.lock=true;const got=R.built.map(j=>t.mix[j].w).join(' '),ok=got===t.words.join(' ');R.res[R.i]=ok;
      $('#app').innerHTML=retoV();const fb=$('#fb');fb.className='fb '+(ok?'good':'bad');fb.textContent=ok?'¡Perfecto! 🎉':'Era: '+t.words.join(' ');
      speak(t.words.join(' '));setTimeout(nextRound,ok?2200:3500);}else $('#app').innerHTML=retoV();break;}
  case 'undo':if(!R.lock){R.built.pop();$('#app').innerHTML=retoV();}break;
  case 'ghear':speak(R.order[R.i].s[0]);break;
  case 'ksay':case 'kslow':{const g=GRAM.find(x=>x.id===c.k);const i=+d.i;karaoke($('#s'+i),g.s[i][0],a==='kslow'?.55:null);break;}
  case 'smic':{const g=GRAM.find(x=>x.id===c.k);const i=+d.i;micButton($('#m'+i),$('#f'+i),g.s[i][0],true,'g:'+g.id+':'+i,'🎤 Léelo tú');break;}
  case 'trtog':CFG.tr=!CFG.tr;save();{const y=window.scrollY;render();window.scrollTo(0,y);}break;
  case 'tapw':{const ws=lookupWord(d.w);if(c.s==='story'||c.s==='gram'){if(PLAY)PLAY.stop=true;}
    if(ws){openCard(ws,0);}else speak(d.w);return 'stop';}
  case 'line':{const s=STORIES.find(x=>x.id===c.k);const i=+d.i;if(PLAY)PLAY.stop=true;c.line=i;
    document.querySelectorAll('.ln').forEach((e,j)=>e.classList.toggle('cur',j===i));karaoke($('#ln'+i),s.p[i][0]);break;}
  case 'lmic':{const s=STORIES.find(x=>x.id===c.k);const i=c.line||0;document.querySelectorAll('.ln').forEach((e,j)=>e.classList.toggle('cur',j===i));
    micButton($('#mline'),$('#fline'),s.p[i][0],true,'s:'+s.id+':'+i,'🎤 Léela tú');break;}
  case 'playall':if(PLAY)PLAY.stop=true;playStory(0);break;
  case 'stopall':if(PLAY)PLAY.stop=true;stopKaraoke();speechSynthesis.cancel();document.querySelectorAll('.ln').forEach(e=>e.classList.remove('cur'));break;
  case 'ddir':c.dir=d.v;c.lim=40;render();break;
  case 'letter':c.q='^'+d.v;c.lim=60;$('#q').value='';$('#dres').innerHTML=dictResults(c);break;
  case 'dmore':c.lim+=60;$('#dres').innerHTML=dictResults(c);break;
  case 'dcard':openCard(c.res,+d.i);break;
  case 'rand':{const w=W[Math.floor(Math.random()*W.length)];openCard([w],0);break;}
  case 'settings':if($('#modal').classList.contains('on')){PENDING=()=>openSheet(settingsV());history.back();}else openSheet(settingsV());break;
  case 'legend':if($('#modal').classList.contains('on')){PENDING=()=>openSheet(legendV());history.back();}else openSheet(legendV());break;
  case 'cfg':{const v=d.v;CFG[d.c]=d.c==='rate'?+v:(v==='true'?true:v==='false'?false:v);save();applyFont();$('#sheet').innerHTML=settingsV();break;}
  case 'test':speak('Hello! Welcome to English class.');break;
  case 'reset':if(el.dataset.sure){P=defP();save();toast('Progreso borrado.');$('#sheet').innerHTML=settingsV();}else{el.dataset.sure='1';el.textContent='¿Seguro? Toca otra vez';}break;
 default:act2(a,d,el);
 }}
document.addEventListener('click',e=>{if(e.target.id==='modal'){history.back();return;}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.dataset.a==='tapw'){e.stopPropagation();act('tapw',b.dataset,b);return;}
  act(b.dataset.a,b.dataset,b);},true);
// cerrar modal de ajustes: volver a pintar la pantalla para aplicar cambios
document.addEventListener('change',e=>{if(e.target.id==='vsel'){CFG.voice=e.target.value;save();speak('Hello! This is my new voice.');$('#sheet').innerHTML=settingsV();}});
try{history.replaceState({n:1},'')}catch(e){}
applyFont();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
